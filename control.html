<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseball Scoreboard Control</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eeeeee;
  padding: 15px;
}

h2 {
  text-align: center;
}

input, select, button {
  font-size: 20px;
  padding: 10px;
  margin: 5px;
}

button {
  min-width: 100px;
}

.section {
  background: white;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 8px;
}

.status {
  background: #222;
  color: white;
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
  text-align: center;
  word-wrap: break-word;
}
</style>
</head>

<body>

<h2>Baseball Scoreboard Control</h2>

<div class="section">
  <input id="awayTeam" placeholder="Away Team">
  <input id="homeTeam" placeholder="Home Team">
</div>

<div class="section">
  <h3>Away Score: <span id="awayScore">0</span></h3>
  <button onclick="changeScore('away',1)">Away +1</button>
  <button onclick="changeScore('away',-1)">Away -1</button>
</div>

<div class="section">
  <h3>Home Score: <span id="homeScore">0</span></h3>
  <button onclick="changeScore('home',1)">Home +1</button>
  <button onclick="changeScore('home',-1)">Home -1</button>
</div>

<div class="section">
  <h3>Inning</h3>
  <select id="half">
    <option value="TOP">TOP</option>
    <option value="BOTTOM">BOTTOM</option>
  </select>

  <input id="inning" type="number" value="1" min="1">
</div>

<div class="section">
  <h3>Outs: <span id="outs">0</span></h3>
  <button onclick="changeScore('outs',1)">Out +1</button>
  <button onclick="changeScore('outs',-1)">Out -1</button>
  <button onclick="resetOuts()">Reset Outs</button>
</div>

<div class="section">
  <h3>Count</h3>

  Balls: <span id="balls">0</span><br>
  <button onclick="changeScore('balls',1)">Ball +1</button>
  <button onclick="changeScore('balls',-1)">Ball -1</button>

  <br><br>

  Strikes: <span id="strikes">0</span><br>
  <button onclick="changeScore('strikes',1)">Strike +1</button>
  <button onclick="changeScore('strikes',-1)">Strike -1</button>

  <br><br>

  <button onclick="resetCount()">Reset Count</button>
</div>

<div class="section">
  <button onclick="save()" style="width:100%;font-weight:bold;">
    UPDATE SCOREBOARD
  </button>
</div>

<div id="status" class="status">
  Starting Firebase...
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/*
  IMPORTANT:
  KEEP YOUR EXISTING FIREBASE CONFIG HERE.
  Replace ONLY the example values below with the
  Firebase config you already used before.
*/

const firebaseConfig ={

  apiKey:"AIzaSyAc6yzvHcP_Taod0Ctmjss6pKd2hKdRETE",

  authDomain:"baseball-scoreboard-fd6ad.firebaseapp.com",

  databaseURL:"https://baseball-scoreboard-fd6ad-default-rtdb.firebaseio.com",

  projectId:"baseball-scoreboard-fd6ad",

  storageBucket:"baseball-scoreboard-fd6ad.firebasestorage.app",

  messagingSenderId:"208584160937",

  appId:"1:208584160937:web:ebd8a20fce17f2fed1dbb8",

  measurementId:"G-FY4J06H31X"


};

const statusBox = document.getElementById("status");

let db;

try {

  const app = initializeApp(firebaseConfig);

  db = getDatabase(app);

  statusBox.textContent = "Firebase connected. Ready to update.";

} catch (error) {

  statusBox.textContent =
    "Firebase setup error: " + error.message;

}


window.changeScore = function(type, amount) {

  const element = document.getElementById(type);

  let value = Number(element.textContent);

  value += amount;

  if (value < 0) value = 0;

  element.textContent = value;

};


window.resetCount = function() {

  document.getElementById("balls").textContent = 0;
  document.getElementById("strikes").textContent = 0;

};


window.resetOuts = function() {

  document.getElementById("outs").textContent = 0;

};


window.save = async function() {

  if (!db) {

    statusBox.textContent =
      "ERROR: Firebase is not connected.";

    return;

  }

  statusBox.textContent = "Saving scoreboard...";

  const data = {

    awayTeam:
      document.getElementById("awayTeam").value || "AWAY",

    homeTeam:
      document.getElementById("homeTeam").value || "HOME",

    awayScore:
      Number(document.getElementById("awayScore").textContent),

    homeScore:
      Number(document.getElementById("homeScore").textContent),

    inning:
      document.getElementById("half").value +
      " " +
      document.getElementById("inning").value +
      "ST",

    outs:
      Number(document.getElementById("outs").textContent),

    balls:
      Number(document.getElementById("balls").textContent),

    strikes:
      Number(document.getElementById("strikes").textContent)

  };

  try {

    await set(ref(db, "scoreboard"), data);

    statusBox.textContent =
      "SUCCESS! Scoreboard updated.";

  } catch (error) {

    statusBox.textContent =
      "FIREBASE ERROR: " + error.message;

  }

};

</script>

</body>
</html>
