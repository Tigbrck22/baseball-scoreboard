    <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseball Scoreboard Control</title>
<style>
body { font-family: Arial; background:#eee; padding:15px; }
.section { background:white; padding:15px; margin-bottom:12px; border-radius:8px; }
button, input, select { font-size:20px; padding:10px; margin:5px; }
.status { background:#222; color:white; padding:12px; margin-top:15px; }
</style>
</head>

<body>

<h2>Baseball Scoreboard Control</h2>

<div class="section">
<input id="awayTeam" placeholder="Away Team">
<input id="homeTeam" placeholder="Home Team">
</div>

<div class="section">
<b>Away Score: <span id="awayScore">0</span></b><br>
<button id="awayPlus">Away +1</button>
<button id="awayMinus">Away -1</button>
</div>

<div class="section">
<b>Home Score: <span id="homeScore">0</span></b><br>
<button id="homePlus">Home +1</button>
<button id="homeMinus">Home -1</button>
</div>

<div class="section">
<select id="half">
<option>TOP</option>
<option>BOTTOM</option>
</select>
<input id="inning" type="number" value="1" min="1">
</div>

<div class="section">
<b>Outs: <span id="outs">0</span></b><br>
<button id="outPlus">Out +1</button>
<button id="outMinus">Out -1</button>
</div>

<div class="section">
<b>Balls: <span id="balls">0</span></b><br>
<button id="ballPlus">Ball +1</button>
<button id="ballMinus">Ball -1</button>
<br>
<b>Strikes: <span id="strikes">0</span></b><br>
<button id="strikePlus">Strike +1</button>
<button id="strikeMinus">Strike -1</button>
</div>

<div class="section">
<button id="update" style="width:100%;font-weight:bold;">
UPDATE SCOREBOARD
</button>
</div>

<div id="status" class="status">Starting...</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getDatabase, ref, set }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


};const firebaseConfig ={

  apiKey:"AIzaSyAc6yzvHcP_Taod0Ctmjss6pKd2hKdRETE",

  authDomain:"baseball-scoreboard-fd6ad.firebaseapp.com",

  databaseURL:"https://baseball-scoreboard-fd6ad-default-rtdb.firebaseio.com",

  projectId:"baseball-scoreboard-fd6ad",

  storageBucket:"baseball-scoreboard-fd6ad.firebasestorage.app",

  messagingSenderId:"208584160937",

  appId:"1:208584160937:web:ebd8a20fce17f2fed1dbb8",

  measurementId:"G-FY4J06H31X"

};
  
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const status = document.getElementById("status");

status.textContent = "Firebase connected. Ready to update.";


function change(id, amount) {
  const el = document.getElementById(id);
  let value = Number(el.textContent) + amount;
  if (value < 0) value = 0;
  el.textContent = value;
}


document.getElementById("awayPlus").onclick = () => change("awayScore", 1);
document.getElementById("awayMinus").onclick = () => change("awayScore", -1);

document.getElementById("homePlus").onclick = () => change("homeScore", 1);
document.getElementById("homeMinus").onclick = () => change("homeScore", -1);

document.getElementById("outPlus").onclick = () => change("outs", 1);
document.getElementById("outMinus").onclick = () => change("outs", -1);

document.getElementById("ballPlus").onclick = () => change("balls", 1);
document.getElementById("ballMinus").onclick = () => change("balls", -1);

document.getElementById("strikePlus").onclick = () => change("strikes", 1);
document.getElementById("strikeMinus").onclick = () => change("strikes", -1);


document.getElementById("update").onclick = async () => {

  status.textContent = "Saving...";

  try {

    await set(ref(db, "scoreboard"), {

      awayTeam: document.getElementById("awayTeam").value || "AWAY",

      homeTeam: document.getElementById("homeTeam").value || "HOME",

      awayScore: Number(document.getElementById("awayScore").textContent),

      homeScore: Number(document.getElementById("homeScore").textContent),

      inning:
        document.getElementById("half").value +
        " " +
        document.getElementById("inning").value,

      outs: Number(document.getElementById("outs").textContent),

      balls: Number(document.getElementById("balls").textContent),

      strikes: Number(document.getElementById("strikes").textContent)

    });

    status.textContent = "SUCCESS! Scoreboard updated.";

  } catch (error) {

    status.textContent = "ERROR: " + error.message;

  }

};

</script>

</body>
</html>
