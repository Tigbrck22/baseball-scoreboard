<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baseball Scoreboard Control</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      margin: 10px auto 20px;
      padding: 10px;
      background: #333;
      border-radius: 8px;
      max-width: 500px;
    }

    .team {
      margin: 20px auto;
      max-width: 500px;
      padding: 20px;
      background: #222;
      border-radius: 12px;
    }

    input {
      width: 90%;
      max-width: 400px;
      padding: 12px;
      margin: 6px;
      font-size: 18px;
      border-radius: 6px;
      border: none;
      text-align: center;
    }

    .score {
      font-size: 60px;
      font-weight: bold;
      margin: 10px;
    }

    button {
      font-size: 20px;
      padding: 14px 22px;
      margin: 6px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    .add {
      background: #2196f3;
      color: white;
    }

    .subtract {
      background: #555;
      color: white;
    }

    #update {
      background: #28a745;
      color: white;
      font-size: 22px;
      padding: 16px 30px;
      margin-top: 20px;
    }

    .inning-controls {
      margin: 20px auto;
      max-width: 500px;
      padding: 20px;
      background: #222;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <h1>Baseball Scoreboard Control</h1>

  <div id="status">Connecting to Firebase...</div>

  <div class="team">
    <h2>Away Team</h2>

    <input id="awayTeam" type="text" value="Mountain View Prep">

    <div id="awayScore" class="score">0</div>

    <button class="add" onclick="changeScore('away', 1)">
      Away +1
    </button>

    <button class="subtract" onclick="changeScore('away', -1)">
      Away -1
    </button>
  </div>

  <div class="team">
    <h2>Home Team</h2>

    <input id="homeTeam" type="text" value="Opponent">

    <div id="homeScore" class="score">0</div>

    <button class="add" onclick="changeScore('home', 1)">
      Home +1
    </button>

    <button class="subtract" onclick="changeScore('home', -1)">
      Home -1
    </button>
  </div>

  <div class="inning-controls">

    <h2>Inning</h2>

    <div id="inning" class="score">1</div>

    <button class="add" onclick="changeInning(1)">
      Inning +1
    </button>

    <button class="subtract" onclick="changeInning(-1)">
      Inning -1
    </button>

  </div>

  <button id="update" onclick="updateScoreboard()">
    UPDATE SCOREBOARD
  </button>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /*
      YOUR FIREBASE CONFIG
    */

    const firebaseConfig = {
     apiKey:"AIzaSyAc6yzvHcP_Taod0Ctmjss6pKd2hKdRETE",
  authDomain:"baseball-scoreboard-fd6ad.firebaseapp.com",
  databaseURL:"https://baseball-scoreboard-fd6ad-default-rtdb.firebaseio.com",
  projectId:"baseball-scoreboard-fd6ad",
  storageBucket:"baseball-scoreboard-fd6ad.firebasestorage.app",
  messagingSenderId:"208584160937",
  appId:"1:208584160937:web:ebd8a20fce17f2fed1dbb8",
  measurementId:"G-FY4J06H31X"

    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const scoreboardRef = ref(db, "scoreboard");


    let awayScore = 0;
    let homeScore = 0;
    let inning = 1;


    /*
      CHANGE SCORE
    */

    window.changeScore = function(team, amount) {

      if (team === "away") {

        awayScore += amount;

        if (awayScore < 0) {
          awayScore = 0;
        }

        document.getElementById("awayScore").textContent = awayScore;

      }

      if (team === "home") {

        homeScore += amount;

        if (homeScore < 0) {
          homeScore = 0;
        }

        document.getElementById("homeScore").textContent = homeScore;

      }

    };


    /*
      CHANGE INNING
    */

    window.changeInning = function(amount) {

      inning += amount;

      if (inning < 1) {
        inning = 1;
      }

      document.getElementById("inning").textContent = inning;

    };


    /*
      SEND SCOREBOARD TO FIREBASE
    */

    window.updateScoreboard = async function() {

      const awayTeam =
        document.getElementById("awayTeam").value;

      const homeTeam =
        document.getElementById("homeTeam").value;


      const scoreboardData = {

        awayTeam: awayTeam,

        homeTeam: homeTeam,

        awayScore: awayScore,

        homeScore: homeScore,

        inning: inning,

        updatedAt: Date.now()

      };


      try {

        await set(scoreboardRef, scoreboardData);

        document.getElementById("status").textContent =
          "Scoreboard updated successfully!";

      } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
          "ERROR: " + error.message;

      }

    };


    /*
      LISTEN FOR FIREBASE CHANGES
    */

    onValue(scoreboardRef, (snapshot) => {

      const data = snapshot.val();

      if (!data) {

        document.getElementById("status").textContent =
          "Firebase connected. No scoreboard data yet.";

        return;

      }


      /*
        Only load Firebase values when they exist.
      */

      if (data.awayTeam !== undefined) {
        document.getElementById("awayTeam").value =
          data.awayTeam;
      }

      if (data.homeTeam !== undefined) {
        document.getElementById("homeTeam").value =
          data.homeTeam;
      }


      if (data.awayScore !== undefined) {

        awayScore = Number(data.awayScore);

        document.getElementById("awayScore").textContent =
          awayScore;

      }


      if (data.homeScore !== undefined) {

        homeScore = Number(data.homeScore);

        document.getElementById("homeScore").textContent =
          homeScore;

      }


      if (data.inning !== undefined) {

        inning = Number(data.inning);

        document.getElementById("inning").textContent =
          inning;

      }


      document.getElementById("status").textContent =
        "Firebase connected. Ready to update.";

    });


  </script>

</body>
</html>
