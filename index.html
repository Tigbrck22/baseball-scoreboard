<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseball Scoreboard</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

.scoreboard {
  background: rgba(0,0,0,0.85);
  padding: 15px;
  width: 450px;
  border-radius: 10px;
}

.team {
  display: flex;
  justify-content: space-between;
  font-size: 25px;
  font-weight: bold;
  padding: 5px;
}

.score {
  font-size: 32px;
}

.info {
  text-align: center;
  border-top: 1px solid white;
  margin-top: 8px;
  padding-top: 8px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="scoreboard">

<div class="team">
<span>MOUNTAIN VIEW PREP</span>
<span class="score">0</span>
</div>

<div class="team">
<span>OPPONENT</span>
<span class="score">0</span>
</div>

<div class="info">
TOP 1ST • 0 OUT
</div>

<div class="info">
COUNT 0-0
</div>

</div>

</body>
</html>
