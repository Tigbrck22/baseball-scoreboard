<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseball Scoreboard</title>

<style>
:root {
  --board-opacity: 0.28;
}

body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

.scoreboard {
  background: rgba(15, 18, 22, var(--board-opacity));
  padding: 8px;
  width: 450px;
  max-width: 100vw;
  box-sizing: border-box;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.16);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  text-shadow: 0 1px 3px rgba(0,0,0,0.85);
}

.team {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 25px;
  font-weight: bold;
  padding: 10px 8px;
  background: rgba(255,255,255,0.035);
}

.team + .team {
  border-top: 1px solid rgba(255,255,255,0.16);
}

.team span:first-child {
  overflow-wrap: anywhere;
}

.score {
  flex-shrink: 0;
  font-size: 32px;
  min-width: 40px;
  text-align: center;
}

.info {
  text-align: center;
  border-top: 1px solid rgba(255,255,255,0.22);
  margin-top: 5px;
  padding: 10px 4px 5px;
  font-size: 30px;
  font-weight: bold;
  background: rgba(255,255,255,0.025);
}

.controls {
  width: 450px;
  max-width: 100vw;
  box-sizing: border-box;
  margin-top: 8px;
  padding: 12px;
  background: rgba(0,0,0,0.9);
  border-radius: 8px;
  color: white;
  font-size: 15px;
  text-shadow: none;
}

.controls label {
  display: block;
  margin: 12px 0 8px;
}

.controls input[type="range"],
.controls input[type="email"],
.controls input[type="password"] {
  width: 100%;
  box-sizing: border-box;
}

.controls input[type="email"],
.controls input[type="password"] {
  padding: 10px;
  margin: 5px 0;
}

.controls button {
  margin-top: 10px;
  padding: 9px 12px;
  font-size: 15px;
}

#loginButton, #saveStatus {
  margin-top: 10px;
}

#saveStatus {
  overflow-wrap: anywhere;
}

body.overlay-mode #controls {
  display: none;
}
</style>
</head>

<body>

<div class="scoreboard">
  <div class="team">
    <span id="awayTeam">MOUNTAIN VIEW PREP</span>
    <span class="score" id="awayScore">0</span>
  </div>

  <div class="team">
    <span id="homeTeam">OPPONENT</span>
    <span class="score" id="homeScore">0</span>
  </div>

  <div class="info">
    <span id="inning">TOP 1ST</span>
    &nbsp;•&nbsp;
    <span id="outs">0 OUTS</span>
  </div>
</div>

<div class="controls" id="controls">
  <h3>Scoreboard Background Opacity</h3>

  <div id="loginArea">
    <p>Log in to change and save the opacity.</p>

    <label for="loginEmail">Firebase account email</label>
    <input
      type="email"
      id="loginEmail"
      value="tigbrck22@gmail.com"
      autocomplete="username"
      placeholder="Email"
    >

    <label for="loginPassword">Password</label>
    <input
      type="password"
      id="loginPassword"
      autocomplete="current-password"
      placeholder="Enter your password"
    >

    <button id="loginButton" type="button">Log In</button>
    <div id="loginStatus"></div>
  </div>

  <div id="opacityArea" hidden>
    <label for="transparency">
      Background opacity:
      <strong id="opacityValue">28%</strong>
    </label>

    <input
      type="range"
      id="transparency"
      min="0"
      max="100"
      value="28"
      step="1"
    >

    <div id="saveStatus">Loading saved opacity...</div>

    <button id="logoutButton" type="button">Log Out</button>
  </div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  set
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAc6yzvHcP_Taod0Ctmjss6pKd2hKdRETE",
  authDomain: "baseball-scoreboard-fd6ad.firebaseapp.com",
  databaseURL: "https://baseball-scoreboard-fd6ad-default-rtdb.firebaseio.com",
  projectId: "baseball-scoreboard-fd6ad",
  storageBucket: "baseball-scoreboard-fd6ad.firebasestorage.app",
  messagingSenderId: "208584160937",
  appId: "1:208584160937:web:ebd8a20fce17f2fed1dbb8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const scoreboardRef = ref(db, "scoreboard");
const opacityRef = ref(db, "overlaySettings/opacity");

const slider = document.getElementById("transparency");
const opacityValue = document.getElementById("opacityValue");
const loginArea = document.getElementById("loginArea");
const opacityArea = document.getElementById("opacityArea");
const loginStatus = document.getElementById("loginStatus");
const saveStatus = document.getElementById("saveStatus");

const overlayMode =
  new URLSearchParams(location.search).get("overlay") === "1";

if (overlayMode) {
  document.body.classList.add("overlay-mode");
}

let currentOpacity = 28;
let saveTimer = null;
let opacityListenerStarted = false;
let opacityWriteInProgress = false;
let pendingRemoteOpacity = null;
let sliderChangedDuringSave = false;

function applyOpacity(value) {
  const opacity = Math.max(0, Math.min(100, Number(value)));

  currentOpacity = opacity;

  document.documentElement.style.setProperty(
    "--board-opacity",
    String(opacity / 100)
  );

  slider.value = String(opacity);
  opacityValue.textContent = opacity + "%";
}

function startOpacityListener() {
  if (opacityListenerStarted) return;
  opacityListenerStarted = true;

  onValue(opacityRef, snapshot => {
    const saved = snapshot.val();

    if (saved === null) {
      applyOpacity(28);
      saveStatus.textContent =
        "No saved opacity yet. Move the slider to save it.";
      return;
    }

    const remoteValue = Math.max(
      0,
      Math.min(100, Number(saved))
    );

    if (opacityWriteInProgress || saveTimer !== null) {
      pendingRemoteOpacity = remoteValue;
      return;
    }

    applyOpacity(remoteValue);
    saveStatus.textContent = "Saved opacity: " + remoteValue + "%";
  }, error => {
    console.error("Opacity read failed:", error);
    saveStatus.textContent = "Could not read opacity: " + error.message;
  });
}

function queueOpacitySave() {
  applyOpacity(slider.value);
  sliderChangedDuringSave = true;

  clearTimeout(saveTimer);
  saveStatus.textContent = "Saving...";

  saveTimer = setTimeout(async () => {
    saveTimer = null;

    if (!auth.currentUser) {
      saveStatus.textContent = "Please log in before saving.";
      return;
    }

    const valueToSave = currentOpacity;
    opacityWriteInProgress = true;
    sliderChangedDuringSave = false;

    try {
      await set(opacityRef, valueToSave);
      saveStatus.textContent = "Opacity saved: " + valueToSave + "%";
    } catch (error) {
      console.error("Opacity write failed:", error);
      saveStatus.textContent = "Save failed: " + error.message;
    } finally {
      opacityWriteInProgress = false;

      if (pendingRemoteOpacity !== null) {
        const remoteValue = pendingRemoteOpacity;
        pendingRemoteOpacity = null;

        if (!sliderChangedDuringSave && saveTimer === null) {
          applyOpacity(remoteValue);
        }
      }
    }
  }, 300);
}

slider.addEventListener("input", queueOpacitySave);

document.getElementById("loginButton").addEventListener("click", async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  loginStatus.textContent = "Logging in...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("loginPassword").value = "";
    loginStatus.textContent = "";
  } catch (error) {
    console.error("Login failed:", error);
    loginStatus.textContent = "Login failed: " + error.message;
  }
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (error) {
    saveStatus.textContent = "Logout failed: " + error.message;
  }
});

onAuthStateChanged(auth, user => {
  if (user) {
    loginArea.hidden = true;
    opacityArea.hidden = false;
  } else {
    loginArea.hidden = false;
    opacityArea.hidden = true;
    loginStatus.textContent = "Please log in to edit opacity.";
  }
});

// Listen for saved opacity on both pages, including the IRL Pro overlay.
startOpacityListener();

// Publicly readable scoreboard data for the IRL Pro overlay.
onValue(scoreboardRef, snapshot => {
  const data = snapshot.val();
  if (!data) return;

  document.getElementById("awayTeam").textContent =
    data.awayTeam || "AWAY";

  document.getElementById("homeTeam").textContent =
    data.homeTeam || "HOME";

  document.getElementById("awayScore").textContent =
    data.awayScore ?? 0;

  document.getElementById("homeScore").textContent =
    data.homeScore ?? 0;

  const half = data.inningHalf || "TOP";
  const number = Math.max(
    1,
    Number(data.inningNumber ?? data.inning) || 1
  );

  const suffix =
    number % 100 >= 11 && number % 100 <= 13
      ? "TH"
      : ({1:"ST", 2:"ND", 3:"RD"}[number % 10] || "TH");

  document.getElementById("inning").textContent =
    half + " " + number + suffix;

  const outs = Number(data.outs) || 0;
  document.getElementById("outs").textContent =
    outs + (outs === 1 ? " OUT" : " OUTS");
});
</script>

</body>
</html>
