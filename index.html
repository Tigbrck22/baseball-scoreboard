<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseball Scoreboard</title>

<style>
:root {
  --board-opacity: 0.45;
}

body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

.scoreboard {
  background: rgba(0, 0, 0, var(--board-opacity));
  padding: 12px;
  width: 450px;
  max-width: 100vw;
  box-sizing: border-box;
  border-radius: 10px;
}

.team {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 25px;
  font-weight: bold;
  padding: 5px;
}

.team span:first-child {
  overflow-wrap: anywhere;
}

.score {
  flex-shrink: 0;
  font-size: 32px;
}

.info {
  text-align: center;
  border-top: 1px solid white;
  margin-top: 8px;
  padding-top: 10px;
  font-size: 30px;
  font-weight: bold;
}

/* Transparency controls */
.controls {
  width: 450px;
  max-width: 100vw;
  box-sizing: border-box;
  margin-top: 8px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.85);
  border-radius: 8px;
  color: white;
  font-size: 14px;
}

.controls label {
  display: block;
  margin-bottom: 8px;
}

.controls input {
  width: 100%;
}

.controls button {
  margin-top: 8px;
  padding: 7px 12px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="scoreboard">
  <div class="team">
    <span id="awayTeam">MOUNTAIN VIEW PREP</span>
    <span class="score" id="awayScore">0</span>
  </div>

  <div class="team">
    <span id="homeTeam">OPPONENT</span>
    <span class="score" id="homeScore">0</span>
  </div>

  <div class="info">
    <span id="inning">TOP 1ST</span>
    &nbsp;•&nbsp;
    <span id="outs">0 OUT</span>
  </div>
</div>

<div class="controls" id="controls">
  <label for="transparency">
    Background opacity: <strong id="opacityValue">45%</strong>
  </label>

  <input
    type="range"
    id="transparency"
    min="0"
    max="100"
    value="45"
    step="5"
  >

  <button id="hideControls" type="button">
    Hide Controls
  </button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getDatabase, ref, onValue } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAc6yzvHcP_Taod0Ctmjss6pKd2hKdRETE",
  authDomain: "baseball-scoreboard-fd6ad.firebaseapp.com",
  databaseURL: "https://baseball-scoreboard-fd6ad-default-rtdb.firebaseio.com",
  projectId: "baseball-scoreboard-fd6ad",
  storageBucket: "baseball-scoreboard-fd6ad.firebasestorage.app",
  messagingSenderId: "208584160937",
  appId: "1:208584160937:web:ebd8a20fce17f2fed1dbb8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const scoreboardRef = ref(db, "scoreboard");

const slider = document.getElementById("transparency");
const opacityValue = document.getElementById("opacityValue");
const controls = document.getElementById("controls");

function setOpacity(value) {
  const opacity = Math.max(0, Math.min(100, Number(value)));
  document.documentElement.style.setProperty(
    "--board-opacity", String(opacity / 100)
  );
  opacityValue.textContent = opacity + "%";

  try {
    localStorage.setItem("baseballOpacity", String(opacity));
  } catch (_) {}
}

try {
  const saved = localStorage.getItem("baseballOpacity");
  if (saved !== null && Number.isFinite(Number(saved))) {
    slider.value = Math.max(0, Math.min(100, Number(saved)));
  }
} catch (_) {}

setOpacity(slider.value);

slider.addEventListener("input", () => {
  setOpacity(slider.value);
});

document.getElementById("hideControls").addEventListener("click", () => {
  controls.style.display = "none";
});

onValue(scoreboardRef, (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  document.getElementById("awayTeam").textContent =
    data.awayTeam || "AWAY";

  document.getElementById("homeTeam").textContent =
    data.homeTeam || "HOME";

  document.getElementById("awayScore").textContent =
    data.awayScore ?? 0;

  document.getElementById("homeScore").textContent =
    data.homeScore ?? 0;

  const half = data.inningHalf || "TOP";
  const number = Math.max(
    1, Number(data.inningNumber ?? data.inning) || 1
  );

  const suffix = number % 100 >= 11 && number % 100 <= 13
    ? "TH"
    : ({1:"ST", 2:"ND", 3:"RD"}[number % 10] || "TH");

  document.getElementById("inning").textContent =
    half + " " + number + suffix;

  const outs = Number(data.outs) || 0;
  document.getElementById("outs").textContent =
    outs + (outs === 1 ? " OUT" : " OUTS");
});
</script>

</body>
</html>
