<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseball Scoreboard</title>

<style>
:root {
  --board-opacity: 0.28;
}

body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

.scoreboard {
  background: rgba(15, 18, 22, var(--board-opacity));
  padding: 8px;
  width: 450px;
  max-width: 100vw;
  box-sizing: border-box;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
}

.team {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 25px;
  font-weight: bold;
  padding: 10px 8px;
  background: rgba(255, 255, 255, 0.035);
}

.team + .team {
  border-top: 1px solid rgba(255, 255, 255, 0.16);
}

.team span:first-child {
  overflow-wrap: anywhere;
}

.score {
  flex-shrink: 0;
  font-size: 32px;
  min-width: 40px;
  text-align: center;
}

.info {
  text-align: center;
  border-top: 1px solid rgba(255, 255, 255, 0.22);
  margin-top: 5px;
  padding: 10px 4px 5px;
  font-size: 30px;
  font-weight: bold;
  background: rgba(255, 255, 255, 0.025);
}

.controls {
  width: 450px;
  max-width: 100vw;
  box-sizing: border-box;
  margin-top: 8px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.85);
  border-radius: 8px;
  color: white;
  font-size: 14px;
  text-shadow: none;
}

.controls label {
  display: block;
  margin-bottom: 8px;
}

.controls input {
  width: 100%;
}

.controls button {
  margin-top: 8px;
  padding: 7px 12px;
  font-size: 14px;
}

body.overlay-mode #controls {
  display: none;
}
</style>
</head>

<body>

<div class="scoreboard">
  <div class="team">
    <span id="awayTeam">MOUNTAIN VIEW PREP</span>
    <span class="score" id="awayScore">0</span>
  </div>

  <div class="team">
    <span id="homeTeam">OPPONENT</span>
    <span class="score" id="homeScore">0</span>
  </div>

  <div class="info">
    <span id="inning">TOP 1ST</span>
    &nbsp;•&nbsp;
    <span id="outs">0 OUTS</span>
  </div>
</div>

<div class="controls" id="controls">
  <label for="transparency">
    Background opacity:
    <strong id="opacityValue">28%</strong>
  </label>

  <input
    type="range"
    id="transparency"
    min="0"
    max="100"
    value="28"
    step="5"
  >

  <button id="hideControls" type="button">
    Hide Controls
  </button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAc6yzvHcP_Taod0Ctmjss6pKd2hKdRETE",
  authDomain: "baseball-scoreboard-fd6ad.firebaseapp.com",
  databaseURL: "https://baseball-scoreboard-fd6ad-default-rtdb.firebaseio.com",
  projectId: "baseball-scoreboard-fd6ad",
  storageBucket: "baseball-scoreboard-fd6ad.firebasestorage.app",
  messagingSenderId: "208584160937",
  appId: "1:208584160937:web:ebd8a20fce17f2fed1dbb8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const scoreboardRef = ref(db, "scoreboard");
const opacityRef = ref(db, "overlaySettings/opacity");

const slider = document.getElementById("transparency");
const opacityValue = document.getElementById("opacityValue");
const controls = document.getElementById("controls");

const overlayMode =
  new URLSearchParams(window.location.search).get("overlay") === "1";

if (overlayMode) {
  document.body.classList.add("overlay-mode");
}

let currentOpacity = 28;
let saveTimer = null;
let isSaving = false;
let pendingRemoteOpacity = null;

function applyOpacity(value) {
  const opacity = Math.max(
    0,
    Math.min(100, Number(value))
  );

  currentOpacity = opacity;

  document.documentElement.style.setProperty(
    "--board-opacity",
    String(opacity / 100)
  );

  slider.value = String(opacity);
  opacityValue.textContent = opacity + "%";
}

function setOpacity(value) {
  applyOpacity(value);

  clearTimeout(saveTimer);
  isSaving = true;

  saveTimer = setTimeout(async () => {
    try {
      await set(opacityRef, currentOpacity);
      pendingRemoteOpacity = null;
    } catch (error) {
      console.error("Could not save opacity to Firebase:", error);
      opacityValue.textContent = currentOpacity + "% (save failed)";
    } finally {
      isSaving = false;
      saveTimer = null;

      if (pendingRemoteOpacity !== null) {
        const remoteValue = pendingRemoteOpacity;
        pendingRemoteOpacity = null;
        applyOpacity(remoteValue);
      }
    }
  }, 200);
}

slider.addEventListener("input", () => {
  setOpacity(slider.value);
});

onValue(opacityRef, snapshot => {
  const savedOpacity = snapshot.val();

  if (savedOpacity === null) {
    if (!isSaving) {
      applyOpacity(28);

      set(opacityRef, 28).catch(error => {
        console.error("Could not initialize opacity:", error);
      });
    }
    return;
  }

  const remoteOpacity = Math.max(
    0,
    Math.min(100, Number(savedOpacity))
  );

  if (isSaving || saveTimer !== null) {
    pendingRemoteOpacity = remoteOpacity;
    return;
  }

  applyOpacity(remoteOpacity);
}, error => {
  console.error("Could not read opacity from Firebase:", error);
  opacityValue.textContent = "Firebase read failed";
});

document.getElementById("hideControls").addEventListener("click", () => {
  controls.style.display = "none";
});

onValue(scoreboardRef, snapshot => {
  const data = snapshot.val();
  if (!data) return;

  document.getElementById("awayTeam").textContent =
    data.awayTeam || "AWAY";

  document.getElementById("homeTeam").textContent =
    data.homeTeam || "HOME";

  document.getElementById("awayScore").textContent =
    data.awayScore ?? 0;

  document.getElementById("homeScore").textContent =
    data.homeScore ?? 0;

  const half = data.inningHalf || "TOP";

  const number = Math.max(
    1,
    Number(data.inningNumber ?? data.inning) || 1
  );

  const suffix =
    number % 100 >= 11 && number % 100 <= 13
      ? "TH"
      : ({1:"ST", 2:"ND", 3:"RD"}[number % 10] || "TH");

  document.getElementById("inning").textContent =
    half + " " + number + suffix;

  const outs = Number(data.outs) || 0;

  document.getElementById("outs").textContent =
    outs + (outs === 1 ? " OUT" : " OUTS");
});
</script>

</body>
</html>
